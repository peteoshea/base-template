name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project source
        uses: actions/checkout@v7.0.1

      - name: Run the bash test script
        run: script/test

      - name: Get latest PSScriptAnalyzer version
        id: ps-version
        run: echo "version=$(Find-Module -Name PSScriptAnalyzer | Select-Object -ExpandProperty Version)" >> $GITHUB_OUTPUT
        shell: pwsh

      - name: Cache PowerShell modules
        id: cache-powershell-modules
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/powershell/Modules
          key: ${{ runner.os }}-powershell-modules-${{ steps.ps-version.outputs.version }}

      - name: Install powershell script analyser
        if: steps.cache-powershell-modules.outputs.cache-hit != 'true'
        run: Install-Module -Name PSScriptAnalyzer -Force
        shell: pwsh

      - name: Run the powershell test script
        run: script/test.ps1
        shell: pwsh
